<!DOCTYPE html>
<html lang="zh-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="mobile-web-app-capable" content="yes">
	<title>結帳 | 真的書店</title>
	<meta name="description" content="真的書店結帳櫃台用的掃描與開單工具。">

	<!-- 官網同一組字體：標題 Noto Serif TC、內文 Noto Sans TC（DESIGN_GUIDE 3.1） -->
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@400;700&display=swap" rel="stylesheet">

	<link rel="stylesheet" href="styles.css">
	<link rel="icon" href="img/favicon_02_128.ico" type="image/png">
</head>

<body>
	<div id="app">
		<header class="app-header">
			<a class="brand" href="https://trulybookstore.in-common.tw/" target="_blank" rel="noopener">
				<img src="img/logo.png" alt="真的書店 Truly Bookstore">
			</a>
			<button id="btn-settings" class="icon-btn" aria-label="設定">⚙️</button>
		</header>

		<main>
			<!-- ============ 畫面 1：填表 ============ -->
			<section id="view-form" class="view active">
				<div class="view-head">
					<span class="eyebrow">Checkout</span>
					<h1>結帳</h1>
				</div>

				<div class="field-group">
					<label class="field">
						<span class="field-label">購買人姓名 ＊</span>
						<input type="text" id="input-name" class="input-text" autocomplete="off"
							placeholder="結帳者姓名">
					</label>

					<div class="field">
						<span class="field-label">發票載具編號</span>
						<div class="field-with-btn">
							<input type="text" id="input-carrier" class="input-text" autocomplete="off"
								placeholder="/ABC1234" maxlength="8">
							<button id="btn-scan-carrier" class="btn-scan" aria-label="掃描載具條碼">📷</button>
						</div>
					</div>
				</div>

				<div class="books-head">
					<span class="eyebrow">Books</span>
					<span id="book-count" class="book-count"></span>
				</div>

				<!-- 書目列由 JS 產生 -->
				<div id="book-rows" class="book-rows"></div>

				<button id="btn-add-book" class="btn btn-secondary btn-large">＋ 加一本書</button>

				<div id="form-error" class="form-error hidden"></div>

				<button id="btn-lookup" class="btn btn-primary btn-large">查詢定價</button>
			</section>

			<!-- ============ 畫面 2：確認 ============ -->
			<section id="view-review" class="view">
				<div class="view-head">
					<span class="eyebrow">Confirm</span>
					<h1>確認明細</h1>
				</div>

				<div id="review-list" class="review-list"></div>
				<div id="totals" class="totals"></div>

				<div class="action-row">
					<button id="btn-back-form" class="btn btn-secondary btn-large">← 回去修改</button>
					<button id="btn-submit" class="btn btn-primary btn-large">確認送出</button>
				</div>
			</section>

			<!-- ============ 畫面 3：完成 ============ -->
			<section id="view-result" class="view">
				<div class="view-head">
					<span class="eyebrow">Done</span>
					<h1 id="result-title">結帳完成</h1>
				</div>

				<div id="result-body" class="result-body"></div>

				<button id="btn-new-order" class="btn btn-primary btn-large">開始下一單</button>
			</section>
		</main>

		<footer class="app-footer">
			<span id="catalog-status">書目載入中…</span>
		</footer>

		<!-- ============ 掃描疊層 ============ -->
		<div id="scan-overlay" class="scan-overlay hidden">
			<div class="scan-card">
				<button id="btn-close-scan" class="scan-close" aria-label="關閉">✕</button>
				<p id="scan-title" class="scan-heading">掃描 ISBN 條碼</p>
				<div id="scanner-container">
					<div id="reader"></div>
				</div>
				<div id="scan-status" class="scan-status">正在開啟相機…</div>
				<button id="btn-cancel-scan" class="btn btn-secondary btn-large">取消</button>
			</div>
		</div>

		<!-- ============ 設定 ============ -->
		<div id="modal-settings" class="modal">
			<div class="modal-content">
				<span class="eyebrow">Settings</span>
				<h3>設定</h3>
				<h4>寫入 Google Sheet</h4>
				<input type="text" id="input-webapp-url" class="input-text"
					placeholder="Apps Script Web App 網址（…/exec）">
				<p>部署方式見 <code>apps_script/checkout_append.gs</code> 開頭的說明。沒填網址時仍可算帳，
					但不會寫進試算表。</p>
				<div class="modal-actions">
					<button id="btn-cancel-settings" class="btn btn-secondary">取消</button>
					<button id="btn-save-settings" class="btn btn-primary">儲存</button>
				</div>
			</div>
		</div>

		<div id="toast" class="toast"></div>
	</div>

	<script type="module" src="dist/bundle.js"></script>
</body>

</html>
